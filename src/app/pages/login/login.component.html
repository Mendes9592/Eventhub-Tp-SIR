<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo"><span>◈</span> EventHub</div>
    <h1>Connexion</h1>
    <p class="auth-card__sub">Accédez à votre compte</p>
    <div class="auth-card__demo">
      <strong>Comptes de démo :</strong><br>
      admin / admin • sophie / any • jean / any
    </div>
    @if(error()){<div class="auth-card__error">⚠ {{error()}}</div>}
    <form (ngSubmit)="submit()" class="auth-form">
      <div class="auth-form__group">
        <label>Nom d'utilisateur</label>
        <input type="text" [(ngModel)]="form.username" name="username" placeholder="ex: sophie" required autocomplete="username"/>
      </div>
      <div class="auth-form__group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="form.password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button class="auth-form__submit" type="submit" [disabled]="loading()">
        {{loading() ? 'Connexion...' : 'Se connecter →'}}
      </button>
    </form>
    <p class="auth-card__link">Pas encore de compte ? <a routerLink="/register">S'inscrire</a></p>
  </div>
</div>
